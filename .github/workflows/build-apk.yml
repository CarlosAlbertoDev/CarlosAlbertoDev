name: Gerar APK - Rota Entregas

on:
  push:
    branches:
      - "**"
    paths:
      - "rota-entregas/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    name: Build APK debug
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rota-entregas
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Conceder permissão de execução ao gradlew
        run: chmod +x gradlew

      - name: Compilar APK de debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Publicar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: rota-entregas-debug-apk
          path: rota-entregas/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
